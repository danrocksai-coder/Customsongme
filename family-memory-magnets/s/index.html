<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Our Family Story | Family Memory Magnets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/family-memory-magnets/fmm.css">
</head>
<body>
<div class="topbar">FAMILY MEMORY <b>MAGNETS</b></div>
<main class="wrap" id="app"><p class="center muted" style="margin-top:40px">Opening your story…</p></main>
<div id="toast" class="toast hidden" role="status"></div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var TOKEN = params.get('t') || '';
  var PIN = ''; try { PIN = sessionStorage.getItem('fmm_pin') || ''; } catch (e) {}
  var S = null;           // latest server state
  var view = 'home';      // home | choose | record | listen
  var busy = false;

  function esc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
  function toast(t, ms) { var el = document.getElementById('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.add('hidden'); }, ms || 3500); }

  function api(path, opts) {
    opts = opts || {};
    var h = opts.headers || {}; if (PIN) h['X-Pin'] = PIN;
    if (opts.json) { h['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
    return fetch('/api/fmm/' + path + (path.indexOf('?') > -1 ? '&' : '?') + 't=' + encodeURIComponent(TOKEN),
      { method: opts.method || (opts.body ? 'POST' : 'GET'), headers: h, body: opts.body, cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Something went wrong.'); e.status = r.status; e.pinRequired = j.pinRequired; throw e; } return j; }); });
  }

  // ---------- recorder (iPhone: audio/mp4, Android: webm/mp4) ----------
  function pickMime() {
    var c = ['audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    if (!window.MediaRecorder) return null;
    for (var i = 0; i < c.length; i++) if (MediaRecorder.isTypeSupported(c[i])) return c[i];
    return '';
  }
  // pending recordings survive refresh / connection loss (IndexedDB)
  var DB = null;
  function idb() {
    if (DB) return Promise.resolve(DB);
    return new Promise(function (res) {
      try { var r = indexedDB.open('fmm', 1); r.onupgradeneeded = function () { r.result.createObjectStore('pending'); }; r.onsuccess = function () { DB = r.result; res(DB); }; r.onerror = function () { res(null); }; } catch (e) { res(null); }
    });
  }
  function pKey(slot, n) { return TOKEN.slice(0, 12) + '|' + slot + '|' + n; }
  function pSave(slot, n, rec) { return idb().then(function (d) { if (!d) return; return new Promise(function (r) { var t = d.transaction('pending', 'readwrite'); t.objectStore('pending').put(rec, pKey(slot, n)); t.oncomplete = r; t.onerror = r; }); }); }
  function pLoad(slot, n) { return idb().then(function (d) { if (!d) return null; return new Promise(function (r) { var q = d.transaction('pending').objectStore('pending').get(pKey(slot, n)); q.onsuccess = function () { r(q.result || null); }; q.onerror = function () { r(null); }; }); }); }
  function pDel(slot, n) { return idb().then(function (d) { if (!d) return; return new Promise(function (r) { var t = d.transaction('pending', 'readwrite'); t.objectStore('pending').delete(pKey(slot, n)); t.oncomplete = r; t.onerror = r; }); }); }

  function uid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }

  function upload(slot, n, rec) {
    // retries transient failures; the same upload id makes retries safe (no duplicates)
    var attempt = 0;
    function go() {
      attempt++;
      return fetch('/api/fmm/upload?t=' + encodeURIComponent(TOKEN) + '&slot=' + slot + '&n=' + n, {
        method: 'POST', body: rec.blob,
        headers: { 'Content-Type': rec.type || 'audio/mp4', 'X-Duration': String(rec.sec), 'X-Upload-Id': rec.id, 'X-Pin': PIN }
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.ok) return j;
          var e = new Error(j.error || 'Upload failed.'); e.status = r.status; throw e;
        });
      }).catch(function (e) {
        if ((e.status === undefined || e.status >= 500) && attempt < 3) return new Promise(function (r) { setTimeout(r, 700 * attempt); }).then(go);
        throw e;
      });
    }
    return go();
  }
  function reportFail(slot, n, err) { try { api('report', { json: { slot: slot, n: n, error: String(err && err.message || err) } }).catch(function () {}); } catch (e) {} }

  // Recorder UI. opts: {slot, n, limit, label, onSaved}
  function recorder(box, opts) {
    var limit = opts.limit, mime = pickMime();
    var stream = null, mr = null, chunks = [], t0 = 0, timer = null, rec = null, state = 'idle', warned = false, wasAuto = false;
    box.innerHTML = '<div class="rec"></div>';
    var ui = box.firstChild;

    function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
    function stopTracks() { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }

    function draw() {
      if (state === 'idle') {
        ui.innerHTML = '<div class="stage">Ready</div><div class="timer">' + fmt(limit) + '</div>' +
          '<button class="recbtn" id="rb" type="button">Tap to record</button><p class="muted">You have up to ' + (limit >= 60 ? (limit / 60) + ' minute' + (limit > 60 ? 's' : '') : limit + ' seconds') + '. Recording stops by itself when time is up.</p><div id="rmsg"></div>';
        ui.querySelector('#rb').onclick = start;
      } else if (state === 'recording') {
        ui.innerHTML = '<div class="stage">Recording…</div><div class="timer" id="tm">' + fmt(limit) + '</div>' +
          '<button class="recbtn on" id="rb" type="button">Tap to stop</button><div id="rmsg"></div>';
        ui.querySelector('#rb').onclick = function () { finish(false); };
      } else if (state === 'review') {
        ui.innerHTML = '<div class="stage">Listen before you send</div><audio controls playsinline src="' + rec.url + '"></audio>' +
          '<button class="btn" id="send" type="button">Send this recording</button>' +
          '<button class="btn alt" id="redo" type="button" style="margin-top:10px">Record again</button><div id="rmsg"></div>';
        ui.querySelector('#send').onclick = send; ui.querySelector('#redo').onclick = function () { discard(); };
      } else if (state === 'sending') {
        ui.innerHTML = '<div class="stage">Sending…</div><p class="muted">Please keep this page open.</p>';
      } else if (state === 'failed') {
        ui.innerHTML = '<div class="msg err">Your recording is safe on this phone but didn\'t send yet. ' + esc(rec.err || '') + '</div>' +
          '<audio controls playsinline src="' + rec.url + '"></audio>' +
          '<button class="btn" id="retry" type="button">Try sending again</button>' +
          '<button class="btn alt" id="redo" type="button" style="margin-top:10px">Record again instead</button>';
        ui.querySelector('#retry').onclick = send; ui.querySelector('#redo').onclick = function () { discard(); };
      }
    }
    function msg(t) { var m = ui.querySelector('#rmsg'); if (m) m.innerHTML = '<div class="msg err">' + esc(t) + '</div>'; }

    function start() {
      if (!navigator.mediaDevices || !window.MediaRecorder || mime === null) { msg('This browser can\'t record audio. Please open the link in Safari (iPhone) or Chrome (Android).'); return; }
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (s) {
        stream = s; chunks = [];
        try { mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); } catch (e) { mr = new MediaRecorder(stream); }
        mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        mr.onstop = onStopped;
        mr.start(1000); t0 = Date.now(); warned = false; wasAuto = false; state = 'recording'; draw();
        timer = setInterval(function () {
          var left = limit - (Date.now() - t0) / 1000, tm = ui.querySelector('#tm');
          if (tm) { tm.textContent = fmt(left); tm.classList.toggle('warn', left <= 5); }
          if (left <= 5 && !warned) { warned = true; toast('5 seconds left', 2000); } // 5-second warning
          if (left <= 0) finish(true);
        }, 200);
      }).catch(function (e) {
        msg(e && e.name === 'NotAllowedError' ? 'The microphone is blocked. Allow microphone access for this page in your browser settings, then try again.' : 'We could not open the microphone: ' + (e && e.message || 'unknown error'));
      });
    }
    function finish(auto) { clearInterval(timer); if (mr && mr.state !== 'inactive') { wasAuto = auto; rec = { sec: Math.min(limit, (Date.now() - t0) / 1000) }; mr.stop(); } }
    function onStopped() {
      stopTracks();
      var type = (mr && mr.mimeType) || mime || 'audio/mp4';
      var blob = new Blob(chunks, { type: type });
      var sec = rec && rec.sec || (Date.now() - t0) / 1000;
      rec = { blob: blob, type: type, sec: Math.round(sec * 10) / 10, id: uid(), url: URL.createObjectURL(blob) };
      if (rec.sec < 1) { state = 'idle'; draw(); msg('That was too short. Please try again.'); return; }
      state = 'review'; draw();
      if (wasAuto) toast('Time is up. Listen, then send.', 3000);
      pSave(opts.slot, opts.n, { blob: blob, type: type, sec: rec.sec, id: rec.id });
    }
    function discard() { if (rec && rec.url) URL.revokeObjectURL(rec.url); rec = null; pDel(opts.slot, opts.n); state = 'idle'; draw(); }
    function send() {
      if (!rec) return; var r = rec; state = 'sending'; draw();
      upload(opts.slot, opts.n, r).then(function (j) {
        pDel(opts.slot, opts.n);
        toast('Saved. Your recording is safe.', 3500);
        opts.onSaved(j);
      }).catch(function (e) {
        reportFail(opts.slot, opts.n, e);
        if (e.status === 409) { pDel(opts.slot, opts.n); toast('This was already saved.'); opts.onSaved(null); return; }
        if (e.status >= 400 && e.status < 500) { rec.err = e.message; state = 'failed'; draw(); return; }
        rec.err = 'Check your connection and try again.'; state = 'failed'; draw();
      });
    }
    // restore a recording that never finished sending (refresh / lost connection)
    pLoad(opts.slot, opts.n).then(function (p) {
      if (p && p.blob) { rec = { blob: p.blob, type: p.type, sec: p.sec, id: p.id, url: URL.createObjectURL(p.blob), err: '' }; state = 'failed'; draw(); ui.insertAdjacentHTML('afterbegin', '<div class="msg info">Welcome back. Your last recording is still here.</div>'); }
    });
    draw();
    return { destroy: function () { clearInterval(timer); stopTracks(); } };
  }

  // ---------- views ----------
  var activeRec = null;
  function setView(v) { if (activeRec) { activeRec.destroy(); activeRec = null; } view = v; render(); window.scrollTo(0, 0); }
  function title() { return esc(S.childName) + ' &amp; ' + esc(S.grandparentName) + '\'s Family Story'; }

  function header() {
    return '<div class="apphead"><small>Family Memory Magnets</small><h1>' + title() + '</h1>' +
      '<div class="bar"><i style="width:' + Math.round(S.completed / 30 * 100) + '%"></i></div>' +
      '<div class="muted">' + S.completed + ' of 30 conversations saved</div></div>';
  }
  function chapters() {
    var h = '';
    S.chapters.forEach(function (c) {
      var st = S.stops.filter(function (s) { return s.chapter === c.n; });
      var done = st.filter(function (s) { return s.status === 'done'; }).length;
      h += '<div class="card chapter"><h3>' + c.n + '. ' + esc(c.title) + '<span>' + done + '/5</span></h3><div class="muted">' + esc(c.setting) + '</div><div class="dots">';
      st.forEach(function (s) { h += '<i class="dot ' + (s.status === 'done' ? 'done' : (s.status !== 'locked' ? 'now' : '')) + '" title="' + esc(s.title) + '"></i>'; });
      h += '</div></div>';
    });
    return h;
  }

  function render() {
    if (!S) return;
    if (S.consentNeeded) return renderConsent();
    var role = S.role, cur = S.current;
    var h = header();

    if (view === 'choose' && role === 'child' && cur && cur.status === 'choose') return renderChoose();
    if (view === 'record' && cur) return renderRecord();
    if (view === 'listen' && cur) return renderListen();

    // ---- home ----
    if (S.done) {
      h += '<div class="card center"><h2>All 30 conversations are saved</h2><p>' + esc(S.childName) + ' and ' + esc(S.grandparentName) + ' have created a family history of their own.</p></div>';
      if (role === 'grandparent' && !S.closingDone) h += '<div class="card"><h3>A closing message</h3><p class="muted">You can leave a personal message of up to 2 minutes.</p><button class="btn" id="goclose">Record my closing message</button></div>';
      h += '<div class="card"><p class="muted">The family movie and keepsake are prepared from your saved recordings. You will hear from me when they are ready.</p></div>';
    } else if (cur) {
      h += '<div class="card"><div class="stage">Stop ' + cur.n + ' of 30 &middot; ' + esc(cur.title) + '</div>';
      if (role === 'child') {
        if (cur.status === 'choose') h += '<h2>Choose the next question</h2><button class="btn" id="gochoose">Pick a question for ' + esc(S.grandparentName) + '</button>';
        else if (cur.status === 'record-question') h += '<h2>Record your question</h2><div class="qbox">' + esc(cur.chosen.text) + '</div><button class="btn" id="gorecord">Record my question</button><button class="btn alt" id="gochoose" style="margin-top:10px">Pick a different question</button>';
        else if (cur.status === 'awaiting-answer') h += '<h2>Your question is saved</h2><p>' + esc(S.grandparentName) + ' will get a private invitation to answer.</p><div id="invite"></div>';
        else if (cur.status === 'heard-pending') h += '<h2>' + esc(S.grandparentName) + ' answered!</h2><button class="btn" id="golisten">Listen to the answer</button>';
      } else {
        if (cur.status === 'awaiting-answer') h += '<h2>' + esc(S.childName) + ' has a question for you</h2><button class="btn" id="gorecord">Listen and answer</button>';
        else if (cur.status === 'heard-pending') h += '<h2>Your answer is saved</h2><p>Waiting for ' + esc(S.childName) + ' to listen. The next question unlocks after that.</p>';
        else h += '<h2>Waiting for ' + esc(S.childName) + '</h2><p>' + esc(S.childName) + ' is choosing the next question. Check back soon.</p>';
        if (!S.introDone && S.completed === 0) h += '<hr style="margin:16px 0;border:0;border-top:1px solid #dde3f2"><p class="muted">Optional: introduce yourself with a short message (up to 2 minutes).</p><button class="btn alt" id="gointro">Record an introduction</button>';
      }
      h += '</div>';
    }
    h += chapters();
    h += '<p class="muted center">Your story stays open until ' + new Date(S.expiresAt).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) + '. There is no rush.' + (S.test ? '<br><b>This is a test story.</b>' : '') + '</p>';
    app.innerHTML = h;

    var $ = function (id) { return app.querySelector('#' + id); };
    if ($('gochoose')) $('gochoose').onclick = function () { setView('choose'); };
    if ($('gorecord')) $('gorecord').onclick = function () { setView('record'); };
    if ($('golisten')) $('golisten').onclick = function () { setView('listen'); };
    if ($('gointro')) $('gointro').onclick = function () { view = 'intro'; renderSpecial('intro'); };
    if ($('goclose')) $('goclose').onclick = function () { view = 'closing'; renderSpecial('closing'); };
    if ($('invite')) renderInvite($('invite'));
  }

  function renderInvite(el) {
    var key = 'fmm_gp_' + S.qrCode, saved = ''; try { saved = localStorage.getItem(key) || ''; } catch (e) {}
    function draw() {
      var msg = encodeURIComponent(S.childName + ' has a question for you! Open your private link to listen and answer: ' + saved);
      if (saved) el.innerHTML = '<button class="btn" id="shr">Send ' + esc(S.grandparentName) + ' her invitation</button><p class="muted" style="margin-top:8px">This opens your phone\'s share sheet (Messages, WhatsApp, email…).</p>';
      else el.innerHTML = '<p class="muted">Paste ' + esc(S.grandparentName) + '\'s private link once (it\'s in your setup email) so this phone can send the invitation for you.</p><input type="text" id="gpl" placeholder="Paste her private link"><button class="btn alt" id="sv" style="margin-top:8px">Save link</button>';
      var b = el.querySelector('#shr');
      if (b) b.onclick = function () {
        var text = S.childName + ' has a question for you! Open your private link to listen and answer.';
        if (navigator.share) navigator.share({ title: 'A question from ' + S.childName, text: text, url: saved }).catch(function () {});
        else location.href = 'sms:?&body=' + msg;
      };
      var sv = el.querySelector('#sv');
      if (sv) sv.onclick = function () { var v = el.querySelector('#gpl').value.trim(); if (!/^https:\/\/.+[?&]t=[\w-]{10,}/.test(v)) { toast('That does not look like her private link.'); return; } saved = v; try { localStorage.setItem(key, v); } catch (e) {} draw(); };
    }
    draw();
  }

  function renderConsent() {
    app.innerHTML = header() +
      '<div class="card"><h2>A parent or guardian says yes first</h2><p>Before ' + esc(S.childName) + ' records anything, a parent or legal guardian needs to give permission.</p>' +
      '<ul style="margin:10px 0 0 20px"><li>Recordings are private and are never posted publicly.</li><li>They are used only to create this family story, movie and keepsake.</li><li>You can ask me to delete them at any time.</li></ul>' +
      '<label for="pn">Your name</label><input type="text" id="pn" autocomplete="name">' +
      '<label class="check"><input type="checkbox" id="ag"><span>I am ' + esc(S.childName) + '\'s parent or legal guardian, and I give permission for ' + esc(S.childName) + '\'s voice to be recorded and saved for this family story.</span></label>' +
      '<div id="cm"></div><button class="btn" id="cb">I agree and continue</button></div>';
    app.querySelector('#cb').onclick = function () {
      api('consent', { json: { parentName: app.querySelector('#pn').value, agree: app.querySelector('#ag').checked } })
        .then(function () { return refresh(); }).catch(function (e) { app.querySelector('#cm').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
    };
  }

  var TYPE = { F: 'Fun', C: 'Curious', M: 'Meaningful' };
  function renderChoose() {
    var cur = S.current, h = header() + '<div class="card"><div class="stage">Stop ' + cur.n + ' &middot; ' + esc(cur.title) + '</div><h2>What would you like to ask ' + esc(S.grandparentName) + '?</h2>';
    cur.choices.forEach(function (c) { h += '<button class="choice" data-q="' + esc(c.id) + '"><small>' + TYPE[c.type] + '</small>' + esc(S.grandparentName) + ', ' + esc(c.text.charAt(0).toLowerCase() + c.text.slice(1)) + '</button>'; });
    h += '<label for="cq">Or ask your own question</label><textarea id="cq" rows="2" maxlength="200" placeholder="Type your question…"></textarea><button class="btn alt" id="usec" style="margin-top:8px">Use my question</button><div id="cm"></div>' +
      '<button class="btn alt" id="back" style="margin-top:14px">Back</button></div>';
    app.innerHTML = h;
    function pick(payload) { api('choose', { json: Object.assign({ n: cur.n }, payload) }).then(function (st) { S = st; setView('record'); }).catch(function (e) { app.querySelector('#cm').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; }); }
    app.querySelectorAll('.choice').forEach(function (b) { b.onclick = function () { pick({ qid: b.getAttribute('data-q') }); }; });
    app.querySelector('#usec').onclick = function () { var v = app.querySelector('#cq').value.trim(); if (!v) { toast('Type a question first.'); return; } pick({ custom: v }); };
    app.querySelector('#back').onclick = function () { setView('home'); };
  }

  function renderRecord() {
    var cur = S.current, role = S.role;
    var h = header(), slot, limit, intro = '';
    if (role === 'child') {
      if (cur.status !== 'record-question') { setView('home'); return; }
      slot = 'question'; limit = S.limits.question;
      h += '<div class="card"><div class="stage">Stop ' + cur.n + ' &middot; ' + esc(cur.title) + '</div><h2>Ask your question</h2><p class="muted">Read it out loud to ' + esc(S.grandparentName) + '.</p><div class="qbox">' + esc(cur.chosen.text) + '</div><div id="rbox"></div><button class="btn alt" id="back" style="margin-top:14px">Back</button></div>';
    } else {
      if (cur.status !== 'awaiting-answer') { setView('home'); return; }
      slot = 'answer'; limit = S.limits.answer;
      h += '<div class="card"><div class="stage">Stop ' + cur.n + ' &middot; ' + esc(cur.title) + '</div><h2>' + esc(S.childName) + ' asks:</h2><div class="qbox" id="qt">' + esc(cur.chosen ? cur.chosen.text : '') + '</div><audio id="qa" controls playsinline preload="auto"></audio><p class="muted">Listen first, then record your answer in your own words.</p><div id="rbox"></div>' +
        '<button class="btn alt" id="skip" style="margin-top:14px">Skip this question</button><button class="btn alt" id="back" style="margin-top:10px">Back</button></div>';
    }
    app.innerHTML = h;
    app.querySelector('#back').onclick = function () { setView('home'); };
    if (role === 'grandparent') {
      api('media?n=' + cur.n + '&slot=question').then(function (m) { app.querySelector('#qa').src = m.url; }).catch(function (e) { toast(e.message); });
      app.querySelector('#skip').onclick = function () {
        if (!confirm('Skip this question? ' + S.childName + ' will choose a different one.')) return;
        api('skip', { json: { n: cur.n } }).then(function (st) { S = st; setView('home'); toast('Skipped. ' + S.childName + ' will pick another.'); }).catch(function (e) { toast(e.message); });
      };
    }
    activeRec = recorder(app.querySelector('#rbox'), { slot: slot, n: cur.n, limit: limit, onSaved: function () { refresh().then(function () { setView('home'); }); } });
  }

  function renderSpecial(slot) {
    var h = header() + '<div class="card"><h2>' + (slot === 'intro' ? 'Introduce yourself' : 'Your closing message') + '</h2><p class="muted">Up to 2 minutes, in your own words.</p><div id="rbox"></div><button class="btn alt" id="back" style="margin-top:14px">Back</button></div>';
    app.innerHTML = h;
    app.querySelector('#back').onclick = function () { setView('home'); };
    if (activeRec) activeRec.destroy();
    activeRec = recorder(app.querySelector('#rbox'), { slot: slot, n: 0, limit: S.limits[slot], onSaved: function () { refresh().then(function () { setView('home'); }); } });
  }

  function renderListen() {
    var cur = S.current;
    if (S.role !== 'child' || cur.status !== 'heard-pending') { setView('home'); return; }
    app.innerHTML = header() + '<div class="card"><div class="stage">Stop ' + cur.n + ' &middot; ' + esc(cur.title) + '</div><h2>' + esc(S.grandparentName) + '\'s answer</h2><audio id="aa" controls playsinline preload="auto"></audio><p class="muted" id="hint">Listen all the way through to continue the adventure.</p><button class="btn" id="cont" disabled>Continue our adventure</button><button class="btn alt" id="back" style="margin-top:10px">Back</button></div>';
    var au = app.querySelector('#aa'), cont = app.querySelector('#cont');
    api('media?n=' + cur.n + '&slot=answer').then(function (m) { au.src = m.url; }).catch(function (e) { toast(e.message); });
    function ok() { cont.disabled = false; app.querySelector('#hint').textContent = 'Ready when you are.'; }
    au.addEventListener('ended', ok);
    au.addEventListener('error', function () { app.querySelector('#hint').textContent = 'This device could not play the answer. You can still continue.'; ok(); });
    cont.onclick = function () { cont.disabled = true; api('heard', { json: { n: cur.n } }).then(function (st) { S = st; setView('home'); toast(st.done ? 'All 30 conversations are complete!' : 'Next stop unlocked!'); }).catch(function (e) { toast(e.message); cont.disabled = false; }); };
    app.querySelector('#back').onclick = function () { setView('home'); };
  }

  // ---------- boot ----------
  function showError(e) {
    if (e.pinRequired || (e.status === 401 && /PIN/i.test(e.message))) {
      app.innerHTML = '<div class="card center"><h2>Enter your PIN</h2><input type="password" inputmode="numeric" id="pin" maxlength="6" style="text-align:center;font-size:1.6rem"><div id="pm"></div><button class="btn" id="pb" style="margin-top:10px">Open</button></div>';
      app.querySelector('#pb').onclick = function () { PIN = app.querySelector('#pin').value; try { sessionStorage.setItem('fmm_pin', PIN); } catch (x) {} boot(); };
      return;
    }
    app.innerHTML = '<div class="card center"><h2>This link is not working</h2><p>' + esc(e.message || 'Something went wrong.') + '</p><p class="muted">If you think this is a mistake, text me at (661) 714-0903 and I will send a fresh link.</p></div>';
  }
  function refresh() { return api('state').then(function (st) { S = st; try { if (S.qrCode) { var m = JSON.parse(localStorage.getItem('fmm_codes') || '{}'); m[S.qrCode] = TOKEN; localStorage.setItem('fmm_codes', JSON.stringify(m)); } } catch (e) {} }); }
  function boot() {
    if (!TOKEN) return showError({ message: 'No link was found.' });
    refresh().then(function () { view = 'home'; render(); }).catch(showError);
  }
  boot();
})();
</script>
</body>
</html>
