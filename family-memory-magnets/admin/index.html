<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Family Memory Magnets</title>
<link rel="stylesheet" href="/family-memory-magnets/fmm.css?v=4e65a6f084">
</head>
<body>
<div class="topbar">FAMILY MEMORY <b>MAGNETS</b> &middot; ADMIN</div>
<main class="wide" id="app" style="padding-top:18px;padding-bottom:60px"></main>
<script src="/family-memory-magnets/admin/magnet.js?v=1127dbc15c"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app'), TOK = '';
  try { TOK = sessionStorage.getItem('fmm_admin') || ''; } catch (e) {}
  function esc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
  function api(path, body) {
    var o = { headers: { Authorization: 'Bearer ' + TOK }, cache: 'no-store' };
    if (body !== undefined) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
    return fetch('/api/fmm/admin/' + path, o).then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Error'); e.status = r.status; throw e; } return j; }); });
  }
  function login(msg) {
    app.innerHTML = '<div class="card" style="max-width:420px;margin:30px auto"><h2>Admin login</h2>' + (msg ? '<div class="msg err">' + esc(msg) + '</div>' : '') +
      '<label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password"><button class="btn" id="go" style="margin-top:12px">Log in</button></div>';
    var go = function () { fetch('/api/fmm/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); })
      .then(function (j) { TOK = j.token; try { sessionStorage.setItem('fmm_admin', TOK); } catch (e) {} load(); }).catch(function (e) { login(e.message); }); };
    document.getElementById('go').onclick = go; document.getElementById('pw').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  var prefill = null, newLinks = null;
  function when(t) { return new Date(t).toLocaleDateString(); }
  function load() {
    api('overview').then(draw).catch(function (e) { if (e.status === 401 || e.status === 503) login(e.status === 503 ? 'Admin is not configured yet (set FMM_SECRET and FMM_ADMIN_PASSWORD in Netlify).' : ''); else app.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
  }
  function draw(d) {
    var pf = prefill || {};
    var h = '';
    if (newLinks) {
      h += '<div class="card"><h2>Private links (shown once)</h2><p class="muted">Copy these now. They are stored only as hashes, so I cannot show them again. Use Revoke &amp; new link if you lose one.</p>' +
        '<b>Family recording link: give to the parent (they record together with the child)</b><code class="link" id="l1">' + esc(newLinks.child) + '</code><button class="btn small alt" data-copy="l1">Copy</button>' +
        '<br><br><b>Grandparent link</b><code class="link" id="l2">' + esc(newLinks.grandparent) + '</code><button class="btn small alt" data-copy="l2">Copy</button>' +
        (newLinks.buyer ? '<br><br><b>Buyer\'s settings link (send to the person who bought it)</b><code class="link" id="l4">' + esc(newLinks.buyer) + '</code><button class="btn small alt" data-copy="l4">Copy</button>' : '') +
        (newLinks.guardian ? '<br><br><b>Parent / guardian link</b><code class="link" id="l3">' + esc(newLinks.guardian) + '</code><button class="btn small alt" data-copy="l3">Copy</button>' : '') +
        '<br><br><button class="btn small" id="dismiss">Done, hide links</button></div>';
    }
    h += '<div class="card"><h2>Create a story</h2><div class="row">' +
      '<div><label>Child first name</label><input type="text" id="cn" value="' + esc(pf.childName || '') + '"></div>' +
      '<div><label>Grandparent name</label><input type="text" id="gn" value="' + esc(pf.grandparent || '') + '"></div>' +
      '<div><label>Second grandparent, only for the "Together" packages</label><input type="text" id="gn2" value="' + esc(pf.grandparent2 || '') + '"></div></div>' +
      '<div class="row"><div><label>Package size</label><select id="sz"><option value="30"' + (pf.stops === 60 ? '' : ' selected') + '>30 conversations ($99.99)</option><option value="60"' + (pf.stops === 60 ? ' selected' : '') + '>60 conversations, The Big Story ($189.99)</option></select></div></div><div class="row">' +
      '<div><label>Parent name</label><input type="text" id="pn" value="' + esc(pf.parentName || '') + '"></div>' +
      '<div><label>Parent email</label><input type="email" id="pe" value="' + esc(pf.email || '') + '"></div>' +
      '</div><div class="row"><div><label>Family link PIN (optional, 4–6 digits)</label><input type="text" id="pi" inputmode="numeric" maxlength="6"></div>' +
      '<div><label>Grandparent PIN (optional)</label><input type="text" id="pg" inputmode="numeric" maxlength="6"></div></div>' +
      '<label class="check"><input type="checkbox" id="by"' + (pf.buyer ? ' checked' : '') + '><span>Give the buyer their own settings link (when a grandparent or relative bought it): profiles, photos, Little Hellos and progress; parent-only decisions stay with the parent</span></label>' +
      '<div class="row"><div><label>Buyer name</label><input type="text" id="bn" value="' + esc(pf.buyerName || '') + '"></div><div><label>Buyer email</label><input type="email" id="be" value="' + esc(pf.buyerEmail || '') + '"></div><div><label>Buyer is</label><select id="br"><option value="grandparent"' + (pf.buyerRole === 'grandparent' ? ' selected' : '') + '>a grandparent</option><option value="other"' + (pf.buyerRole === 'other' ? ' selected' : '') + '>someone else</option></select></div></div>' +
      (pf.orderId ? '<div class="msg info" style="font-weight:500">From the order, the story starts with: ' + esc(pf.summary || '') + '</div>' : '') +
      '<label class="check"><input type="checkbox" id="gd"' + (pf.parentLogin ? ' checked' : '') + '><span>Give the parent a separate dashboard login (optional; consent, the child\'s own link, Little Hellos and pausing then live there)</span></label>' +
      '<div class="row"><div><label>How was it paid?</label><select id="pay"><option value="stripe">Card (Stripe)</option><option value="cash">Cash</option><option value="other">Other (Venmo, Zelle, check…)</option><option value="free">Free / gift from me</option><option value="">Not paid yet / test</option></select></div>' +
      '<div><label>Payment note (optional)</label><input type="text" id="paynote" maxlength="200" placeholder="e.g. $99.99 cash, Nov 16"></div></div>' +
      '<label class="check"><input type="checkbox" id="ts"><span>Test story (adult fictional recordings only, skips parent consent)</span></label>' +
      '<div id="cmsg"></div><button class="btn" id="mk">Create story &amp; links</button></div>';

    var wl = d.waitlist || [], bySrc = {};
    wl.forEach(function (w) { var k = w.source || 'direct'; bySrc[k] = (bySrc[k] || 0) + 1; });
    h += '<div class="card"><h2>Waiting list (' + wl.length + ')</h2>';
    if (!wl.length) h += '<p class="muted">No signups yet.</p>'; else {
      h += '<p class="muted">Where they came from: ' + Object.keys(bySrc).map(function (k) { return esc(k) + ' ' + bySrc[k]; }).join(' &middot; ') + '</p>' +
        '<button class="btn small alt" id="wlcopy">Copy all emails</button> <button class="btn small alt" id="wlcsv">Download CSV</button>' +
        '<details style="margin-top:8px"><summary>Show signups</summary><table><tr><th>Date</th><th>Name</th><th>Email</th><th>Interested in</th><th>From</th><th>Note</th></tr>' +
        wl.map(function (w) { return '<tr><td>' + when(w.createdAt) + '</td><td>' + esc(w.name) + '</td><td>' + esc(w.email) + '</td><td>' + esc(w.interest || '') + '</td><td>' + esc(w.source || 'direct') + '</td><td>' + esc(w.notes || '') + '</td></tr>'; }).join('') + '</table></details>';
    }
    h += '</div>';

    h += '<div class="card"><h2>Orders (' + d.orders.length + ')</h2>';
    if (!d.orders.length) h += '<p class="muted">No orders yet.</p>'; else {
      h += '<table><tr><th>Date</th><th>Package</th><th>Parent</th><th>Child / grandparent</th><th>Status</th><th></th></tr>';
      d.orders.forEach(function (o) {
        h += '<tr><td>' + when(o.createdAt) + '</td><td>' + esc(o.packageLabel) + '</td><td>' + esc(o.buyerName || o.parentName) + (o.buyerRole && o.buyerRole !== 'parent' ? ' <span class="muted">(' + esc(o.buyerRole) + ')</span>' : '') + '<br><span class="muted">' + esc(o.email) + '</span>' + (o.buyerRole && o.buyerRole !== 'parent' ? '<br>Parent: ' + esc(o.parentName) + ' <span class="muted">' + esc(o.parentEmail || '') + '</span>' : '') + (o.gpAddress ? '<br><span class="muted">Magnet 1 (grandparent): ' + (function (a) { return a && a.line1 ? esc(a.line1) + ', ' + esc(a.city) + ', ' + esc(a.state) + ' ' + esc(a.zip) : '-'; })(o.gpAddress) + '<br>Magnet 2 (child): ' + (function (a) { return a && a.line1 ? esc(a.line1) + ', ' + esc(a.city) + ', ' + esc(a.state) + ' ' + esc(a.zip) : '-'; })(o.childAddress) + '<br>Magnets: child ' + (o.magnets ? (o.magnets.child.hasPhoto ? '<a href="#" data-ophoto="' + esc(o.id) + '|child">photo</a>' : esc(o.magnets.child.figure)) + ', grandparent ' + (o.magnets.gp.hasPhoto ? '<a href="#" data-ophoto="' + esc(o.id) + '|gp">photo</a>' : esc(o.magnets.gp.figure)) : 'not chosen') +
          '<br>Child records: ' + (o.childRecording === 'own' ? 'on their own (needs consent step)' : 'with a parent') + (o.waiverAt ? ' &middot; waiver signed ' + when(o.waiverAt) : '') + '</span>' : '') + '</td><td>' + esc(o.childName) + ' / ' + esc(o.grandparent1) + (o.grandparent2 ? ', ' + esc(o.grandparent2) : '') + '</td><td>' + esc(o.status) +
          (o.paid ? '<br><span class="muted">paid: ' + esc(o.paid.method) + (o.paid.note ? ', ' + esc(o.paid.note) : '') + ' (' + when(o.paid.at) + ')</span>' : '') + '</td><td>' +
          (!o.paid && o.status !== 'story-created' ? '<button class="btn small alt" data-paid="' + esc(o.id) + '">Mark paid (cash / other)</button> ' : '') +
          (o.package === 'two'
            ? '<button class="btn small" data-order="' + esc(o.id) + '|1">Create story with ' + esc(o.grandparent1) + '</button> <button class="btn small" data-order="' + esc(o.id) + '|2">Create story with ' + esc(o.grandparent2) + '</button>' + (o.storyIds && o.storyIds.length ? '<br><span class="muted">' + o.storyIds.length + ' of 2 created</span>' : '')
            : (o.status !== 'story-created' ? '<button class="btn small" data-order="' + esc(o.id) + '|1">Create story</button>' : '')) + '</td></tr>';
      });
      h += '</table><p class="muted">Orders show "awaiting payment" until you confirm payment in Stripe. Paid in cash or another way? Use "Mark paid". Create the story only after the payment arrives.</p>';
    }
    h += '</div>';

    h += '<div class="card"><h2>Stories (' + d.stories.length + ')</h2>';
    if (!d.stories.length) h += '<p class="muted">No stories yet.</p>';
    d.stories.forEach(function (s) {
      h += '<div style="border-top:1px solid #dde3f2;padding:14px 0"><b>' + esc(s.childName) + ' &amp; ' + esc(s.grandparentName) + '</b>' + (s.test ? ' <span class="muted">(test)</span>' : '') +
        (s.deletionRequestedAt ? '<div class="msg err">The parent asked for these recordings to be deleted (' + when(s.deletionRequestedAt) + '). Review, deliver anything owed, then use Finish &amp; delete.</div>' : '') + (s.childPaused ? '<div class="msg info">Child recording is paused by the parent.</div>' : '') +
        '<br><span class="muted">' + s.completed + '/' + (s.total || 30) + ' complete &middot; created ' + when(s.createdAt) + ' &middot; ' + (s.completedAt ? 'finished ' + when(s.completedAt) + ', keepsake until ' + when(s.expiresAt) : 'no deadline (designed for ' + ((s.total || 30) === 60 ? '1 year' : '6 months') + ')') +
          ((s.profiles || []).length ? ' &middot; profile: ' + s.profiles.map(function (p) { return esc(p.name) + ' ' + p.answered + '/' + p.total; }).join(', ') : '') + (s.pin ? ' &middot; PIN set' : '') + '<br>Parent: ' + esc(s.parentName || '-') + ' ' + esc(s.parentEmail || '') + ' &middot; Paid: ' + (s.payment ? esc(s.payment.method) + (s.payment.note ? ' (' + esc(s.payment.note) + ')' : '') : (s.test ? 'test' : 'not recorded')) + '<br>Consent: ' + (s.consent ? 'yes, ' + esc(s.consent.parentName) + ' on ' + when(s.consent.at) : (s.test ? 'not required (test)' : '<b style="color:#b42318">NOT RECORDED</b>')) + ' &middot; Grandparent agreed: ' + (s.grandparentConsent ? 'yes, ' + esc(s.grandparentConsent.name) + ' on ' + when(s.grandparentConsent.at) : (s.test ? 'not required (test)' : 'not yet')) + '</span>';
      if (!s.completedAt && s.lastActivityAt && Date.now() - s.lastActivityAt > 730 * 86400e3) h += '<div class="msg info">No activity on this story for 2 years. Per the privacy policy, contact the family before deleting it.</div>';
      if (s.completedAt && s.expiresAt && s.expiresAt < Date.now()) h += '<div class="msg err">This story\'s keep-until date has passed (' + when(s.expiresAt) + '). The privacy policy promises deletion: deliver anything owed, then use Finish &amp; delete.</div>';
      var PB = s.publication, ans = function (x) { return x ? (x.choice === 'share' ? 'share' : 'private') + ' (' + esc(x.name) + ', ' + when(x.at) + ')' : 'no answer'; };
      if (PB.unpublishRequestedAt) h += '<div class="msg err">Someone took back their yes to sharing (' + when(PB.unpublishRequestedAt) + '). Take the video off YouTube and the keepsake links within 7 days. <button class="btn small" data-unpub="' + s.id + '">Done, it is taken down</button></div>';
      if (s.completed > 0) h += '<div class="muted">Story ID (for the movie maker): <code>' + esc(s.id) + '</code>' + (s.completed < (s.total || 30) ? ' &middot; ' + s.completed + '/' + (s.total || 30) + ' done, draft movies only' : '') + '</div>';
      if (s.completed >= (s.total || 30)) h += '<div class="muted">Publishing: <b>' + (PB.allowed ? 'ALLOWED' : 'NOT allowed') + '</b> &middot; parent: ' + ans(PB.parent) + ' &middot; grandparent: ' + ans(PB.grandparent) + '</div>';
      var A = s.childAccess;
      if (A.status === 'pending') h += '<div class="msg info"><b>Consent form waiting for review.</b> Uploaded by ' + esc(A.parentName) + ' on ' + when(A.formUploadedAt) + '. Check: it names ' + esc(s.childName) + ', is signed and dated, and the printed name matches.<div class="row" style="margin-top:8px"><button class="btn small alt" data-form="' + s.id + '">View form</button><button class="btn small" data-fok="' + s.id + '">Approve</button><button class="btn small red" data-fno="' + s.id + '">Not approved</button></div></div>';
      h += '<div class="muted">Child\'s own link: ' + (A.status === 'approved' ? 'permission approved (' + (A.basis === 'age-13-plus' ? 'parent says 13+' : 'signed form') + ', ' + esc(A.parentName) + (A.decidedAt ? ', ' + when(A.decidedAt) : '') + '), link ' + (A.linkActive ? '<b>ON</b>' : 'off') : A.status === 'pending' ? 'form pending' : A.status === 'rejected' ? 'form not approved: ' + esc(A.reviewNote) : 'not requested (parent-run)') + (A.hasForm && A.status !== 'pending' ? ' &middot; <a href="#" data-form="' + s.id + '">view form</a>' : '') + '</div>';
      if (s.failures.length) h += '<div class="msg err">Upload problems: ' + s.failures.map(function (f) { return esc(f.slot) + ' ' + (f.n || '') + ': ' + esc(f.error) + ' (' + new Date(f.at).toLocaleString() + ')'; }).join('<br>') + '</div>';
      h += '<div style="margin:8px 0">' + s.recordings.map(function (r) {
        return '<div class="muted">Stop ' + r.n + ': ' + esc(r.chosen || '') + '<br>' + (r.q ? '<button class="btn small alt" data-play="' + s.id + '|question|' + r.n + '">Play question</button> <button class="btn small alt" data-dl="' + s.id + '|question|' + r.n + '||stop' + r.n + '-question">Download</button> ' : '') + (r.a ? '<button class="btn small alt" data-play="' + s.id + '|answer|' + r.n + '">Play answer</button> <button class="btn small alt" data-dl="' + s.id + '|answer|' + r.n + '||stop' + r.n + '-answer">Download</button>' : '') + '</div>';
      }).join('') + (s.hasIntro ? '<button class="btn small alt" data-play="' + s.id + '|intro|0">Play intro</button> <button class="btn small alt" data-dl="' + s.id + '|intro|0||intro">Download</button> ' : '') + (s.hasClosing ? '<button class="btn small alt" data-play="' + s.id + '|closing|0">Play closing</button> <button class="btn small alt" data-dl="' + s.id + '|closing|0||closing">Download</button>' : '') + '<audio id="au-' + s.id + '" controls class="hidden"></audio></div>' +
        '<div class="row"><button class="btn small alt" data-rev="' + s.id + '|child">Revoke &amp; new family link</button><button class="btn small alt" data-rev="' + s.id + '|grandparent">Revoke &amp; new grandparent link</button></div>' +
        '<details style="margin-top:10px"><summary><b>QR codes, PINs, Little Hellos, keepsake</b></summary>' +
        '<div class="row" style="margin-top:10px">' + ['child', 'grandparent'].map(function (r) {
          var nm = r === 'child' ? s.childName : s.grandparentName, code = s.qrCodes[r];
          return '<div class="card" style="margin:0"><b>' + esc(nm) + '\'s permanent QR</b><br><img alt="QR code for ' + esc(nm) + '" data-qr="' + esc(code) + '" style="width:100%;max-width:220px;background:#fff"><br>' +
            '<code class="link">' + esc(s.qrUrls[r]) + '</code><span class="muted">This web address is public and never contains a private link. It stays the same after the story is finished.</span><div class="row" style="margin-top:6px">' +
            '<a class="btn small alt" href="#" data-qrdl="' + esc(code) + '|svg">Download SVG</a><a class="btn small alt" href="#" data-qrdl="' + esc(code) + '|png">Download PNG</a></div>' +
            '<button class="btn small" style="margin-top:6px" data-magnet="' + esc(code) + '|' + esc(s.grandparents ? s.childName + ', ' + s.grandparents[0] + ' & ' + s.grandparents[1] : s.childName + ' & ' + s.grandparentName) + '|' + esc(nm) + '|' + (s.magnets ? (r === 'child' ? s.magnets.child.figure : s.magnets.gp.figure) : '') + '|' + (s.magnets && s.orderId && (r === 'child' ? s.magnets.child.hasPhoto : s.magnets.gp.hasPhoto) ? s.orderId + ':' + (r === 'child' ? 'child' : 'gp') : '') + '">Magnet artwork (5×5 in, Printful)' + (s.magnets ? ': ' + ((r === 'child' ? s.magnets.child.hasPhoto : s.magnets.gp.hasPhoto) ? 'photo' : esc(r === 'child' ? s.magnets.child.figure : s.magnets.gp.figure)) : '') + '</button>' +
            '<div class="muted" style="margin-top:8px">PIN: ' + (s.pins[r] ? 'set' : 'none') + ' &middot; remembered phones: ' + s.devices[r] + '</div><div class="row" style="margin-top:6px">' +
            '<input type="text" inputmode="numeric" maxlength="6" placeholder="New PIN (blank = none)" data-pinval="' + s.id + '|' + r + '"><button class="btn small alt" data-setpin="' + s.id + '|' + r + '">Set / clear PIN</button>' +
            '<button class="btn small alt" data-forget="' + s.id + '|' + r + '">Forget all phones</button></div></div>';
        }).join('') + '</div>' +
        '<div class="card" style="margin:10px 0 0"><b>Parent / guardian login</b> <span class="muted">(optional; the purchaser decides)</span>' +
        (s.hasGuardian
          ? '<div class="muted">Active. PIN: ' + (s.pins.guardian ? 'set' : 'none') + ' &middot; remembered phones: ' + s.devices.guardian + '</div><div class="row" style="margin-top:6px"><button class="btn small alt" data-rev="' + s.id + '|guardian">Revoke &amp; new parent link</button>' +
            '<input type="text" inputmode="numeric" maxlength="6" placeholder="Parent PIN (blank = none)" data-pinval="' + s.id + '|guardian"><button class="btn small alt" data-setpin="' + s.id + '|guardian">Set / clear PIN</button><button class="btn small alt" data-forget="' + s.id + '|guardian">Forget all phones</button></div>'
          : '<div class="muted">No parent login yet. The parent uses the child link today. Add one for younger children or when the purchaser wants control.</div><div class="row" style="margin-top:6px"><button class="btn small" data-addg="' + s.id + '">Add parent login</button></div>') + '</div>' +
        '<div class="card" style="margin:10px 0 0"><b>Buyer login</b> <span class="muted">(when someone other than the parent bought it)</span>' +
        (s.hasBuyer
          ? '<div class="muted">Active' + (s.buyer && s.buyer.name ? ': ' + esc(s.buyer.name) + ' ' + esc(s.buyer.email || '') : '') + '. PIN: ' + (s.pins.buyer ? 'set' : 'none') + ' &middot; remembered phones: ' + s.devices.buyer + '</div><div class="row" style="margin-top:6px"><button class="btn small alt" data-rev="' + s.id + '|buyer">Revoke &amp; new buyer link</button>' +
            '<input type="text" inputmode="numeric" maxlength="6" placeholder="Buyer PIN (blank = none)" data-pinval="' + s.id + '|buyer"><button class="btn small alt" data-setpin="' + s.id + '|buyer">Set / clear PIN</button><button class="btn small alt" data-forget="' + s.id + '|buyer">Forget all phones</button></div>'
          : '<div class="row" style="margin-top:6px"><button class="btn small alt" data-addb="' + s.id + '">Add buyer login</button></div>') + '</div>' +
        '<div class="card" style="margin:10px 0 0"><b>Little Hellos</b> <span class="muted">(' + s.hellos.length + ' sent)</span><div class="row" style="margin-top:6px">' +
        '<label class="check" style="margin:0"><input type="checkbox" data-hen="' + s.id + '"' + (s.helloSettings.enabled ? ' checked' : '') + '><span>Enabled</span></label>' +
        '<select data-hst="' + s.id + '"><option value="both">Sweet + playful</option><option value="sweet">Sweet only</option><option value="funny">Playful only</option><option value="custom">My own messages only</option></select></div>' +
        '<label>Your own approved messages (one per line, up to 150 characters)</label><textarea rows="3" data-hcu="' + s.id + '">' + esc((s.helloSettings.custom || []).join('\n')) + '</textarea>' +
        '<button class="btn small" style="margin-top:6px" data-hsave="' + s.id + '">Save Little Hello settings</button>' +
        s.hellos.map(function (m) { return '<div class="muted" style="margin-top:6px">' + new Date(m.at).toLocaleDateString() + ' &middot; from ' + (m.from === 'child' ? esc(s.childName) : esc(s.grandparentName)) + ': ' + (m.kind === 'text' ? esc(m.text) : '<button class="btn small alt" data-play="' + s.id + '|hello|0|' + esc(m.id) + '">Play voice</button>') + '</div>'; }).join('') + '</div>' +
        '<div class="card" style="margin:10px 0 0"><b>Keepsake</b> <span class="muted">(shown to the family on their QR codes once the story is complete)</span>' +
        '<div class="muted">Status: ' + esc(s.keepsake.status) + '. Only mark ready when real links exist.</div>' +
        '<label>Links, one per line: Label | https://…</label><textarea rows="3" data-kit="' + s.id + '">' + esc((s.keepsake.items || []).map(function (i) { return i.label + ' | ' + i.url; }).join('\n')) + '</textarea>' +
